name: TurfmappExpenseReport
options:
  bundleIdPrefix: io.turfmapp
  deploymentTarget:
    iOS: "26.0"

targets:
  TurfmappExpenseReport:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - TurfmappExpenseReport
      - path: TurfmappExpenseReport/Resources/en.lproj/Localizable.strings
        type: file
      - path: TurfmappExpenseReport/Resources/th.lproj/Localizable.strings
        type: file
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.turfmapp.expense-report
        SWIFT_VERSION: "6.0"
        INFOPLIST_FILE: TurfmappExpenseReport/Info.plist
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"

  TurfmappExpenseReportTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - TurfmappExpenseReportTests
    dependencies:
      - target: TurfmappExpenseReport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.turfmapp.expense-report.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
